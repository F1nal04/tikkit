rule_files:
  - backup-alerts.yml
evaluation_interval: 1m

tests:
  - name: a healthy daily backup raises nothing
    interval: 1m
    input_series:
      - series: 'up{job="tikkit-backup"}'
        values: '1x2000'
      - series: 'tikkit_backup_last_run_success{job="tikkit-backup"}'
        values: '1x2000'
      - series: 'tikkit_backup_last_success_timestamp_seconds{job="tikkit-backup"}'
        values: '0x600 86400x1400'
      - series: 'tikkit_backup_screenshots_missing{job="tikkit-backup"}'
        values: '0x2000'
    alert_rule_test:
      - eval_time: 30h
        alertname: TikkitBackupStale
        exp_alerts: []
      - eval_time: 30h
        alertname: TikkitBackupFailed
        exp_alerts: []
  - name: a failed run, a stale backup and missing files alert
    interval: 1m
    input_series:
      - series: 'tikkit_backup_last_run_success{job="tikkit-backup"}'
        values: '1x60 0x1900'
      - series: 'tikkit_backup_last_success_timestamp_seconds{job="tikkit-backup"}'
        values: '0x2000'
      - series: 'tikkit_backup_screenshots_missing{job="tikkit-backup"}'
        values: '0x60 2x1900'
    alert_rule_test:
      - eval_time: 1h
        alertname: TikkitBackupFailed
        exp_alerts: []
      - eval_time: 90m
        alertname: TikkitBackupFailed
        exp_alerts:
          - exp_labels: { job: tikkit-backup }
            exp_annotations:
              summary: The most recent backup run failed. The previous good backup is still in place.
              runbook: https://github.com/F1nal04/tikkit/blob/main/docs/backup-restore.md#failure-alerts
      - eval_time: 29h
        alertname: TikkitBackupStale
        exp_alerts: []
      - eval_time: 31h
        alertname: TikkitBackupStale
        exp_alerts:
          - exp_labels: { job: tikkit-backup }
            exp_annotations:
              summary: No successful backup for more than 30 hours.
              runbook: https://github.com/F1nal04/tikkit/blob/main/docs/backup-restore.md#failure-alerts
      - eval_time: 90m
        alertname: TikkitBackupMissingScreenshots
        exp_alerts:
          - exp_labels: { job: tikkit-backup }
            exp_annotations:
              summary: The database references screenshots whose files are missing from the volume.
              runbook: https://github.com/F1nal04/tikkit/blob/main/docs/backup-restore.md#consistency-between-database-and-screenshots
  - name: an unreachable sidecar alerts
    interval: 1m
    input_series:
      - series: 'up{job="tikkit-backup"}'
        values: '1x5 0x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: TikkitBackupSidecarDown
        exp_alerts: []
      - eval_time: 20m
        alertname: TikkitBackupSidecarDown
        exp_alerts:
          - exp_labels: { job: tikkit-backup }
            exp_annotations:
              summary: The backup sidecar's status endpoint cannot be scraped.
              runbook: https://github.com/F1nal04/tikkit/blob/main/docs/backup-restore.md#failure-alerts
