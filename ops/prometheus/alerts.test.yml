rule_files:
  - alerts.yml
evaluation_interval: 1m

tests:
  - name: provider failure with a completed queue handoff
    interval: 1m
    input_series:
      - series: 'tikkit_ticket_operations_total{job="tikkit",operation="ai_generation_failed"}'
        values: '0+1x10'
      - series: 'tikkit_ticket_operations_total{job="tikkit",operation="queue_intake_after_ai"}'
        values: '0+1x10'
      - series: 'tikkit_ticket_operations_total{job="tikkit",operation="ai_handoff_failed"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: TikkitAiHandoffFailed
        exp_alerts: []
  - name: a failed handoff and overdue attempts, notifications, and confirmations
    interval: 1m
    input_series:
      - series: 'tikkit_ticket_operations_total{job="tikkit",operation="ai_handoff_failed"}'
        values: '0 0 1 1 1'
      - series: 'tikkit_worker_oldest_due_seconds{job="tikkit",worker="ai_attempts"}'
        values: '0 190 250 310 0'
      - series: 'tikkit_worker_oldest_due_seconds{job="tikkit",worker="auto_close"}'
        values: '0 190 250 310 0'
      - series: 'tikkit_worker_oldest_due_seconds{job="tikkit",worker="notifications"}'
        values: '0 360 420 480 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: TikkitAiHandoffFailed
        exp_alerts:
          - exp_labels: { job: tikkit, operation: ai_handoff_failed }
            exp_annotations:
              summary: An AI-stage ticket could not be handed off to the help desk.
              runbook: https://github.com/F1nal04/tikkit/blob/main/docs/operations.md#ai-handoffs-and-provider-failures
      - eval_time: 3m
        alertname: TikkitAiAttemptStuck
        exp_alerts:
          - exp_labels: { job: tikkit, worker: ai_attempts }
            exp_annotations:
              summary: An AI-stage ticket is overdue for a result or handoff.
              runbook: https://github.com/F1nal04/tikkit/blob/main/docs/operations.md#ai-handoffs-and-provider-failures
      - eval_time: 3m
        alertname: TikkitConfirmationTimeoutStuck
        exp_alerts:
          - exp_labels: { job: tikkit, worker: auto_close }
            exp_annotations:
              summary: A staff resolution confirmation deadline expired and auto-close is behind.
              runbook: https://github.com/F1nal04/tikkit/blob/main/docs/operations.md#resolution-confirmation-timeouts
      - eval_time: 3m
        alertname: TikkitNotificationOutboxStuck
        exp_alerts:
          - exp_labels: { job: tikkit, worker: notifications }
            exp_annotations:
              summary: A notification is overdue for delivery processing.
              runbook: https://github.com/F1nal04/tikkit/blob/main/docs/operations.md#notifications-and-smtp
      - eval_time: 4m
        alertname: TikkitAiAttemptStuck
        exp_alerts: []
      - eval_time: 4m
        alertname: TikkitConfirmationTimeoutStuck
        exp_alerts: []
      - eval_time: 4m
        alertname: TikkitNotificationOutboxStuck
        exp_alerts: []
  - name: exporter and database outage with recovery
    interval: 1m
    input_series:
      - series: 'up{job="tikkit",instance="offline"}'
        values: '0 0 0 1'
      - series: 'tikkit_database_ready{job="tikkit",instance="database_down"}'
        values: '0 0 0 1'
      - series: 'tikkit_worker_snapshot_up{job="tikkit",instance="database_down"}'
        values: '0 0 0 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: TikkitMetricsUnreachable
        exp_alerts:
          - exp_labels: { job: tikkit, instance: offline }
            exp_annotations:
              summary: The private Tikkit exporter cannot be scraped.
              runbook: https://github.com/F1nal04/tikkit/blob/main/docs/operations.md#api-and-database
      - eval_time: 2m
        alertname: TikkitDatabaseNotReady
        exp_alerts:
          - exp_labels: { job: tikkit, instance: database_down }
            exp_annotations:
              summary: PostgreSQL is unavailable or its migration history does not match the API.
              runbook: https://github.com/F1nal04/tikkit/blob/main/docs/operations.md#api-and-database
      - eval_time: 2m
        alertname: TikkitWorkerSnapshotUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: TikkitMetricsUnreachable
        exp_alerts: []
      - eval_time: 3m
        alertname: TikkitDatabaseNotReady
        exp_alerts: []
  - name: separate worker backlog query, polling, and email problems
    interval: 1m
    input_series:
      - series: 'tikkit_database_ready{job="tikkit"}'
        values: '1+0x5'
      - series: 'tikkit_worker_snapshot_up{job="tikkit"}'
        values: '0 0 0 0 0 1'
      - series: 'tikkit_worker_last_success_timestamp_seconds{job="tikkit",worker="auto_close"}'
        values: '0 0 0 0 0 0 360'
      - series: 'tikkit_worker_last_success_timestamp_seconds{job="tikkit",worker="ai_attempts"}'
        values: '0+60x6'
      - series: 'tikkit_ticket_operations_total{job="tikkit",operation="notification_email_failed"}'
        values: '0 0 1 2 3 3'
    alert_rule_test:
      - eval_time: 2m
        alertname: TikkitWorkerSnapshotUnavailable
        exp_alerts:
          - exp_labels: { job: tikkit }
            exp_annotations:
              summary: The API is ready but the worker backlog query is failing or timing out.
              runbook: https://github.com/F1nal04/tikkit/blob/main/docs/operations.md#worker-health
      - eval_time: 4m
        alertname: TikkitWorkerNotPolling
        exp_alerts: []
      - eval_time: 4m
        alertname: TikkitNotificationEmailFailing
        exp_alerts:
          - exp_labels: { job: tikkit, operation: notification_email_failed }
            exp_annotations:
              summary: Repeated notification email failures were recorded.
              runbook: https://github.com/F1nal04/tikkit/blob/main/docs/operations.md#notifications-and-smtp
      - eval_time: 5m
        alertname: TikkitWorkerSnapshotUnavailable
        exp_alerts: []
      - eval_time: 5m
        alertname: TikkitWorkerNotPolling
        exp_alerts:
          - exp_labels: { job: tikkit, worker: auto_close }
            exp_annotations:
              summary: auto_close has not completed a poll recently.
              runbook: https://github.com/F1nal04/tikkit/blob/main/docs/operations.md#worker-health
      - eval_time: 6m
        alertname: TikkitWorkerNotPolling
        exp_alerts: []
  - name: a retention run that stays pending
    interval: 1m
    input_series:
      - series: 'tikkit_worker_oldest_due_seconds{job="tikkit",worker="retention"}'
        values: '0 3600 21700+60x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: TikkitRetentionRunStuck
        exp_alerts: []
      - eval_time: 20m
        alertname: TikkitRetentionRunStuck
        exp_alerts:
          - exp_labels: { job: tikkit, worker: retention }
            exp_annotations:
              summary: A data retention run has been pending for more than six hours.
              runbook: https://github.com/F1nal04/tikkit/blob/main/docs/operations.md#data-retention
  - name: restore mode left on
    interval: 1m
    input_series:
      - series: 'tikkit_restore_mode{job="tikkit"}'
        values: '1x1000'
    alert_rule_test:
      - eval_time: 11h
        alertname: TikkitRestoreModeLeftOn
        exp_alerts: []
      - eval_time: 13h
        alertname: TikkitRestoreModeLeftOn
        exp_alerts:
          - exp_labels: { job: tikkit }
            exp_annotations:
              summary: RESTORE_MODE has been on for 12 hours. The API runs no jobs and sends no email or AI calls.
              runbook: https://github.com/F1nal04/tikkit/blob/main/docs/backup-restore.md#post-restore-checklist-before-any-live-work
