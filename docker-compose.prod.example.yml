name: tikkit

x-service-defaults: &service-defaults
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-probe-defaults: &probe-defaults
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 15s

services:
  proxy:
    <<: *service-defaults
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    user: "10001:10001"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set the public hostname and any nondefault HTTPS port}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    ports:
      - "${PROXY_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PROXY_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
    tmpfs:
      - /config
    networks:
      edge: { gw_priority: 1 }
      app: {}
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      <<: *probe-defaults
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2016/health"]

  web:
    <<: *service-defaults
    image: ${TIKKIT_WEB_IMAGE:?set an explicit web image reference}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PROTOCOL_HEADER: x-forwarded-proto
      API_ORIGIN: http://api:3001
      SHUTDOWN_TIMEOUT: 20
    networks: [app]
    depends_on:
      api: { condition: service_healthy }
    stop_grace_period: 30s
    healthcheck:
      <<: *probe-defaults
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/setup', { redirect: 'manual', headers: { 'x-forwarded-proto': 'https' } }).then(r => { if (r.status !== 200 && r.status !== 303) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"]

  api:
    <<: *service-defaults
    image: ${TIKKIT_API_IMAGE:?set an explicit API image reference}
    environment:
      ENVIRONMENT: production
      API_ADDR: 0.0.0.0:3001
      PUBLIC_ORIGIN: https://${PUBLIC_HOST:?set the public hostname and any nondefault HTTPS port}
      DATABASE_URL: postgres://tikkit:${TIKKIT_DB_PASSWORD:?set a hex application DB password}@postgres:5432/tikkit
      SESSION_SECRET: ${SESSION_SECRET:?set a session secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set an encryption key}
      # Only Caddy and web SSR forward client addresses on this network.
      TRUSTED_PROXIES: 172.30.0.0/24
      METRICS_PORT: ${METRICS_PORT:-}
      SCREENSHOT_DIR: /var/lib/tikkit/screenshots
      SHUTDOWN_TIMEOUT_SECS: 20
    volumes:
      - screenshots-data:/var/lib/tikkit/screenshots
    networks:
      egress: { gw_priority: 1 }
      app: {}
      db: {}
    stop_grace_period: 40s
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *probe-defaults
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/api/health >/dev/null && curl -fsS http://127.0.0.1:3001/api/ready >/dev/null"]

  postgres:
    <<: *service-defaults
    image: postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
    user: "999:999"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-local=peer --auth-host=scram-sha-256
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a PostgreSQL bootstrap password}
      TIKKIT_DB_PASSWORD: ${TIKKIT_DB_PASSWORD:?set a hex application DB password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=3775
      - /tmp
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/10-tikkit.sql
    networks: [db]
    stop_grace_period: 60s
    healthcheck:
      <<: *probe-defaults
      # TCP only becomes available after the official image finishes initialization.
      test: ["CMD-SHELL", 'PGPASSWORD="$${TIKKIT_DB_PASSWORD}" psql -h 127.0.0.1 -U tikkit -d tikkit -Atq -c "SELECT 1"']

configs:
  caddyfile:
    file: ./ops/caddy/Caddyfile
  postgres-init:
    file: ./ops/compose/init-postgres.sql

networks:
  edge:
  egress:
  app:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  db:
    internal: true

volumes:
  caddy-data:
  postgres-data:
  screenshots-data:
