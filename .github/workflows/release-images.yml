name: Release images

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      component:
        description: Component to publish
        required: true
        type: choice
        options: [web, api]
      tag:
        description: Existing release tag (web-vX.Y.Z or api-vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-images-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMPONENT: ${{ inputs.component }}
      TAG: ${{ inputs.tag }}
    outputs:
      revision: ${{ steps.tag.outputs.revision }}
    steps:
      - name: Validate the release request
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ||
                ! "$TAG" =~ ^(web|api)-v[0-9]+\.[0-9]+\.[0-9]+$ ||
                "$TAG" != "$COMPONENT"-* ]]; then
            echo "Run from main and select a matching web-vX.Y.Z or api-vX.Y.Z tag." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the release revision
        id: tag
        run: |
          git merge-base --is-ancestor HEAD origin/main
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ci:
    needs: release-ref
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      component: ${{ inputs.component }}
      revision: ${{ needs.release-ref.outputs.revision }}

  publish:
    needs: [release-ref, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      COMPONENT: ${{ inputs.component }}
      TAG: ${{ inputs.tag }}
      REVISION: ${{ needs.release-ref.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-ref.outputs.revision }}
          persist-credentials: false
      - name: Publish a new version to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="${GITHUB_REPOSITORY,,}-$COMPONENT"
          image="ghcr.io/$repository:$TAG"
          token=$(curl -fsSG -u "$GITHUB_ACTOR:$GHCR_TOKEN" \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:$repository:pull,push" \
            https://ghcr.io/token | jq -er '.token | select(type == "string" and length > 0)')
          body=$(mktemp)
          trap 'rm -f "$body"; docker logout ghcr.io' EXIT
          accept='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'
          status=$(curl -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H "Accept: $accept" "https://ghcr.io/v2/$repository/manifests/$TAG")
          if [[ "$status" == 200 ]]; then
            echo "Refusing to overwrite existing image $image." >&2
            exit 1
          fi
          if [[ "$status" != 404 ]] ||
              ! jq -e '.errors | any(.code == "MANIFEST_UNKNOWN" or .code == "NAME_UNKNOWN")' "$body" >/dev/null; then
            echo "Could not confirm the tag is absent (GHCR status $status)." >&2
            exit 1
          fi

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN token
          docker buildx create --driver docker-container --use
          docker buildx build --platform linux/amd64 --push --provenance=mode=max \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.version=$TAG" \
            --tag "$image" -f "apps/$COMPONENT/Dockerfile" .
