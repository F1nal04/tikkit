name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      web-tag: ${{ steps.release.outputs['apps/web--tag_name'] }}
      api-tag: ${{ steps.release.outputs['apps/api--tag_name'] }}
    steps:
      - name: Create a repository-scoped release token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Update the release PR or create releases
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  web:
    needs: release
    if: needs.release.outputs.web-tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-images.yml
    with:
      component: web
      tag: ${{ needs.release.outputs.web-tag }}

  api:
    needs: release
    if: needs.release.outputs.api-tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-images.yml
    with:
      component: api
      tag: ${{ needs.release.outputs.api-tag }}
