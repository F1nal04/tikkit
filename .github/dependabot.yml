version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Keep Node types in line with the supported runtime (engines: node >=22.17).
      # Bump by hand when the Node floor is raised.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Groups take minor/patch only; majors arrive as individual PRs.
    groups:
      svelte:
        patterns:
          - "svelte"
          - "@sveltejs/*"
          - "svelte-check"
          - "vite"
          - "vitest"
          - "@testing-library/svelte"
        update-types: ["minor", "patch"]
      all:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # One PR for minor/patch so Cargo.lock bumps don't keep rebasing each other.
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
