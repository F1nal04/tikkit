# cargo-audit exceptions. Policy: docs/security-scanning.md.
[advisories]
ignore = [
    # rsa 0.9 Marvin timing attack, no fixed release. It is only in Cargo.lock as an
    # optional dependency of sqlx-mysql (via sqlx-macros-core); neither is ever
    # compiled for this Postgres-only build (`cargo tree -e all -i rsa --target all`
    # prints nothing). Remove when sqlx stops locking it or rsa ships a fix.
    # https://rustsec.org/advisories/RUSTSEC-2023-0071
    "RUSTSEC-2023-0071",
    # libsqlite3-sys 0.30 bundles a SQLite with CVE-2026-119375; the fix needs
    # libsqlite3-sys >= 0.39, which sqlx 0.8 does not accept. It is only in
    # Cargo.lock as an optional dependency of sqlx-sqlite (via sqlx-macros-core)
    # and is never compiled for this Postgres-only build
    # (`cargo tree -e all -i libsqlite3-sys --target all` prints nothing).
    # Remove when sqlx stops locking it or accepts a fixed release.
    # https://rustsec.org/advisories/RUSTSEC-2026-0459
    "RUSTSEC-2026-0459",
]
