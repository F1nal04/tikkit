# Local development database. Usage: docker compose -f docker-compose.dev.yml up -d
name: tikkit-dev

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: tikkit
      POSTGRES_USER: tikkit
      POSTGRES_PASSWORD: tikkit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tikkit -d tikkit"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
