# Local development services. Not for production (see docs/configuration.md).
#
#   docker compose -f compose.dev.yml up -d     # start PostgreSQL
#   docker compose -f compose.dev.yml down      # stop (data is kept)
#   docker compose -f compose.dev.yml down -v   # stop and delete all data
#
# The API's development default DATABASE_URL matches these credentials:
#   postgres://tikkit:tikkit@127.0.0.1:5432/tikkit
# Integration tests create and drop their own databases on the same server
# (TEST_DATABASE_URL defaults to postgres://tikkit:tikkit@127.0.0.1:5432/postgres).
name: tikkit-dev

services:
  postgres:
    # Supported server version: PostgreSQL 16 (see docs/database.md).
    image: postgres:16
    environment:
      POSTGRES_USER: tikkit
      POSTGRES_PASSWORD: tikkit # development only
      POSTGRES_DB: tikkit
    ports:
      # Bound to loopback only; never expose the development database.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tikkit -d tikkit"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
